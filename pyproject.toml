[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F541", "F601", "F63", "F7", "F811", "F82", "F841"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "backend", "scripts"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
allow_redefinition = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "index",
    "misc",
    "name-defined",
    "no-redef",
    "operator",
    "override",
    "return-value",
    "type-var",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = ["backend.features.admin.runtime", "backend.platform.telegram.private_config_adapters", "backend.platform.telegram.private_config_handler", "backend.features.group_ops.group_hooks.core", "backend.features.group_ops.group_hooks.controls"]
enable_error_code = ["call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = "backend.platform.config.core.settings"
# Pydantic Settings loads required fields from environment at construction.
disable_error_code = ["call-arg"]
